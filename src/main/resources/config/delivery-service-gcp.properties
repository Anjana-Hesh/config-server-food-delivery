# GCP Profile Configuration for Delivery Service

# Spring Cloud Eureka Registry - Private IPs of GCP VMs
eureka.client.serviceUrl.defaultZone=http://10.0.1.20:8761/eureka/,http://10.0.2.20:8761/eureka/
eureka.instance.prefer-ip-address=true

# Database Connectivity - Cloud SQL PostgreSQL Instance Private IP
spring.datasource.url=jdbc:postgresql://10.120.0.5:5432/bytebites_delivery
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Google Cloud Storage Upload Settings
gcp.project-id=intense-slice-505613-d3
gcp.bucket-name=bytebites-media-bucket-intense-slice-505613-d3
app.upload.base-url=https://storage.googleapis.com/bytebites-media-bucket-intense-slice-505613-d3/

# Hikari Connection Pool Settings (prevents exceeding Cloud SQL connection limits)
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=10000

