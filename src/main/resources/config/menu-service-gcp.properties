# GCP Profile Configuration for Menu Service

# Spring Cloud Eureka Registry - Private IPs of GCP VMs
eureka.client.serviceUrl.defaultZone=http://10.0.1.20:8761/eureka/,http://10.0.2.20:8761/eureka/
eureka.instance.prefer-ip-address=true

# Disable MongoDB for the GCP profile (switching to Datastore/Firestore)
spring.data.mongodb.repositories.enabled=false
spring.data.mongodb.uri=

# Google Cloud Datastore Configuration
spring.cloud.gcp.datastore.enabled=true
spring.cloud.gcp.datastore.project-id=intense-slice-505613-d3

# Google Cloud Storage Upload Settings
gcp.project-id=intense-slice-505613-d3
gcp.bucket-name=bytebites-media-bucket-intense-slice-505613-d3
app.upload.base-url=https://storage.googleapis.com/bytebites-media-bucket-intense-slice-505613-d3/

# Allow overriding MongoDB repository with Datastore repository
spring.main.allow-bean-definition-overriding=true

# Google Cloud Storage Spring integration
spring.cloud.gcp.storage.enabled=true
spring.cloud.gcp.storage.project-id=intense-slice-505613-d3

# Exclude MongoDB Auto-Configurations on GCP Profile
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration,org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration,org.springframework.boot.autoconfigure.data.mongo.MongoRepositoriesAutoConfiguration



