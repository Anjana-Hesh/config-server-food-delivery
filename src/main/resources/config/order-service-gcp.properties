# GCP Profile Configuration for Order Service

# Spring Cloud Eureka Registry - Private IPs of GCP VMs
eureka.client.serviceUrl.defaultZone=http://10.0.1.20:8761/eureka/,http://10.0.2.20:8761/eureka/
eureka.instance.prefer-ip-address=true

# Database Connectivity - Cloud SQL MySQL Instance Private IP
spring.datasource.url=jdbc:mysql://10.120.0.3:3306/bytebites_orders?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=your_gcp_mysql_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Inter-service communications via API Gateway Load Balancer IP
app.payment-service.url=http://10.0.0.10:8080/api/payments/charge
